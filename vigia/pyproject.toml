[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigia-nids"
version = "1.0.3"
description = "Control de calidad continuo para los datos de modelos de ciberseguridad"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Joshua" }]
keywords = ["nids", "dataset", "data-quality", "machine-learning", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

dependencies = [
  "polars>=1.0",
  # Sin techo en 0.x seria una apuesta; 1.0 puede cambiar la API de la que depende cli.py.
  "typer>=0.12,<1",
  "rich>=13.0",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Joshua203-byte/vigia-nids"
Documentation = "https://github.com/Joshua203-byte/vigia-nids/tree/main/vigia/docs"
Issues = "https://github.com/Joshua203-byte/vigia-nids/issues"
Changelog = "https://github.com/Joshua203-byte/vigia-nids/blob/main/vigia/CHANGELOG.md"

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.4",
  "numpy>=1.26",
  # `labels.noise` (confident learning) y la comparación antes/después.
  "cleanlab>=2.6",
  "lightgbm>=4.0",
  # `dup.near` (MinHash LSH para casi-duplicados).
  "datasketch>=2.0",
]
parquet = ["pyarrow>=15.0"]
# Extraer flujos de un PCAP. Arrastra libpcap, que en Linux necesita
# libpcap-dev instalado en el sistema, por eso va aparte.
pcap = ["nfstream>=6.5", "pandas>=2.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  # Mide pico de RSS en benchmarks/escala.py.
  "psutil>=5.9",
  "mypy>=1.10",
  # Requerido por starlette.testclient.TestClient para probar la API (extra `api`).
  "httpx>=0.27",
]

[project.scripts]
vigia = "vigia.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia"]

[tool.hatch.build.targets.sdist]
# Sin esta lista el sdist empaqueta todo lo que no esta ignorado por git: con
# un `web/node_modules` instalado pesaba 28,6 MB con 3.752 archivos (binarios
# de Windows incluidos). Esto es lo que hace falta para construir, probar y
# leer la documentacion; el panel web se distribuye con la imagen Docker, no
# con el paquete.
include = ["src", "tests", "docs", "benchmarks", "README.md", "CHANGELOG.md", "LICENSE"]
# Los archivos LICENSE y README de cada dependencia de `web/node_modules` se
# colaban igual por la regla de licencias de hatch, aun fuera de `include`.
exclude = ["web", "**/node_modules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# El CSS del reporte es una cadena literal: partir las reglas por ancho de
# línea la vuelve ilegible.
"src/vigia/report/render.py" = ["E501"]
# Los títulos de los hallazgos son frases en español que se leen en el reporte;
# cortarlas en varias líneas de código no mejora nada.
"src/vigia/checks/*.py" = ["E501"]
# Las plantillas de timestamp del generador de demostración son f-strings largas
# que se entienden mejor en una sola línea.
"benchmarks/*.py" = ["E501"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/vigia"]

[tool.coverage.report]
# Empieza en el valor medido el 23/09/2026 (89%), redondeado hacia abajo para
# no ser fragil ante fluctuaciones menores. Subir con el tiempo, no bajar
# (docs/PLAN.md, fase 4.3): importa mas en las rutas de error que en las
# felices, asi que el umbral existe para que un check que deja de reportar
# 'skipped' correctamente no pase desapercibido.
fail_under = 85
show_missing = true
