# Errores conocidos del dataset que Vigía ya detecta y documenta (no son
# inventados: cada uno corresponde a un check existente y a texto ya escrito
# en docs/).
known_issues:
  - id: "flow.termination"
    note: >
      CICFlowMeter parte una conexión larga en varios flujos por timeout
      (docs/CHECKS.md linea ~117), lo que infla el conteo de flujos por
      sesión real.
  - id: "validity.nan_inf"
    note: >
      Columnas de tasa (bytes/s, paquetes/s) generan NaN/Inf cuando la
      duración del flujo es cero (docs/USO.md linea ~478-485).
  - id: "validity.constant"
    note: >
      Init_Win_bytes_* usa -1 como centinela de "no aplica" propio de
      CICFlowMeter, no un valor real (docs/CHECKS.md linea ~281).
