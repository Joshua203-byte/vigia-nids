# Perfil de CIC-IDS2017 (sección 11.3 de vigia.md, requisito R17).
#
# Fuente de los datos de ataque: pagina oficial del CIC, University of New
# Brunswick — https://www.unb.ca/cic/datasets/ids-2017.html (verificado
# 26/09/2026). Las IPs y horarios son los publicados ahi, no estimaciones.
id: cic-ids-2017
name: "CIC-IDS2017"

# CICFlowMeter deja el nombre de columna con un espacio inicial (" Label",
# " Destination Port"); Vigía ya se lo quita con strip_column_names() al leer
# (ver io/readers.py). No hay un esquema canónico tipo "dst_port": Vigía
# trabaja con el nombre real de la columna, así que esto solo fija los roles
# para que --profile evite que el usuario los repita a mano en cada corrida.
column_roles:
  label_col: "Label"
  dst_port_col: "Destination Port"

# IPs atacantes y víctimas documentadas por día, con la ventana horaria de
# cada ataque. Útil como contexto para revisar manualmente hallazgos de
# leak.host o leak.temporal contra el comportamiento esperado del dataset.
