# Perfil de CTU-13 (seccion 11.3 de vigia.md, requisito R17).
#
# Fuente: README.md de cada CTU-Malware-Capture-Botnet-42..54 en
# https://mcfp.felk.cvut.cz/publicDatasets/ y pagina oficial
# https://www.stratosphereips.org/datasets-ctu13 (consultados 30/09/2026).
# Formato y etiquetas comprobados sobre capture20110815-2.binetflow.2format
# (escenario 5). Horas en CEST, como las publica el README.
id: ctu-13
name: "CTU-13"

# Columnas de los archivos .binetflow.2format (cabecera verificada).
column_roles:
  label_col: "Label"
  time_col: "StartTime"
  src_ip_col: "SrcAddr"
  dst_ip_col: "DstAddr"
  src_port_col: "Sport"
  dst_port_col: "Dport"
  protocol_col: "Proto"

# Las etiquetas llevan el prefijo "flow=". Clases vistas en el escenario 5:
# flow=Background*, flow=To-Background-*, flow=From-Normal-* y
# flow=From-Botnet-V<n>-*. El README aclara que "From-Botnet" son flujos
# generados por el malware y "To-Botnet" los enviados al botnet por equipos
# desconocidos, que no son maliciosos per se.
label_values:
  prefix: "flow="
  benign_prefixes: ["flow=Background", "flow=To-Background", "flow=From-Background", "flow=From-Normal", "flow=To-Normal", "flow=Normal-"]
  attack_prefixes: ["flow=From-Botnet"]
  not_malicious_per_se: ["flow=To-Botnet"]

# `vigia.load()` y `--streaming` agrupan la etiqueta por prefijo antes de
# auditar; la original queda en la columna `__label_original`. Sin esto la
# columna tiene decenas de subtipos y labels.noise / labels.imbalance no
# significan nada. "to_botnet" va aparte: segun el README no es malicioso per se.
# "flow=Normal-" (sin From/To) es una familia que aparece en 11 de los 13
# escenarios (flow=Normal-V46-HTTP-windowsupdate, de 1 a 24 flujos): observada
# en los datos, no esta en la documentacion.
label_groups:
  botnet: ["flow=From-Botnet"]
  to_botnet: ["flow=To-Botnet"]
  normal: ["flow=From-Normal", "flow=To-Normal", "flow=Normal-"]
  background: ["flow=Background", "flow=To-Background", "flow=From-Background"]

# Hosts infectados de los 13 escenarios (todos en 147.32.84.0/24).
