known_issues:
  - id: "background_no_es_benigno"
    note: >
      "Background" significa que los autores no pudieron decidir si el
      trafico es malicioso; no equivale a "benigno" (pagina oficial).
  - id: "to_botnet"
    note: >
      Los flujos "To-Botnet" los envian equipos desconocidos hacia el botnet
      y no deben considerarse maliciosos per se (README oficial).
  - id: "pcap_completo_no_publico"
    note: >
      El pcap con todo el trafico no es publico por contener datos privados
      de los usuarios de la red; solo se publica el de la maquina infectada.
  - id: "hosts_en_datos"
    note: >
      Observado (30/09/2026): en 11 de 13 escenarios los orígenes de los
      flujos From-Botnet coinciden con los hosts infectados del README. En el
      escenario 3 (Botnet-44) aparece además 38.229.70.20 (63 flujos) y en el
      12 (Botnet-53) seis orígenes externos con 4 a 5 flujos cada uno
      (222.160.227.154, 93.103.254.175, 91.188.37.153, 69.104.66.134,
      95.65.17.47, 161.200.133.204).
  - id: "etiquetas_granulares"
    note: >
      Observado: la columna Label tiene decenas de subtipos por escenario
      (60 en el 5), no una clase por categoria. El perfil la agrupa en botnet,
      to_botnet, normal y background (label_groups) y deja la original en
      __label_original: auditarla sin agrupar hace que labels.imbalance y
      labels.noise no sean significativos.
  - id: "ventanas_nulas"
    note: >
      Observado: SrcWin y DstWin vienen vacias en los flujos que no son TCP
      (75 % de las filas en el escenario 5). validity.nan_inf las reporta como
      valores no finitos, pero son faltantes estructurales, no corrupcion.
