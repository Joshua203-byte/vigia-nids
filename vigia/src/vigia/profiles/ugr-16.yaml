known_issues:
  - id: "labels.noise"
    note: >
      Trabajos posteriores sobre UGR'16 reportan etiquetas erroneas en el
      test set: parte del trafico "background" sigue patrones de ataque, y
      "blacklist" marca IPs que no necesariamente atacan.
  - id: "botnet_inyectado"
    note: >
      El trafico nerisbotnet es una captura externa (CTU-13, Botnet-42) con
      marcas de tiempo e IPs reescritas, no trafico generado en la red.
  - id: "anonimizacion"
    note: >
      Las IPs estan anonimizadas con CryptoPAN (preserva prefijos).
