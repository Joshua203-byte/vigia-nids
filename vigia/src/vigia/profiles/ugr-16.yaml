# Perfil de UGR'16 (seccion 11.3 de vigia.md, requisito R17).
#
# Fuente: Macia-Fernandez et al., "UGR'16: A New Dataset for the Evaluation of
# Cyclostationarity-Based Network IDSs", Computers & Security, 2018
# (https://nesg.ugr.es/nesg-ugr16/dataset_AuthorVersionFinal.pdf; consultado
# 30/09/2026): tablas II (calendario), III (lotes), IV (capturas), V (IPs) y
# VII (etiquetas). El paper NO indica zona horaria.
id: ugr-16
name: "UGR'16"

# Formato comprobado el 30/09/2026 sobre una muestra de 5.000 filas de
# ugr16-july-week5 (copia de terceros en github.com/krisbolton/
# machine-learning-for-security; no pude bajar los archivos oficiales porque
# nesg.ugr.es responde 403): el CSV NO trae cabecera y tiene 13 columnas. Las
# 12 primeras son los campos nfdump del paper, en orden (te, td, sa, da, sp,
# dp, pr, flg, fwd, stos, pkt, byt); la 13 es la etiqueta. Ninguna fuente
# nombra esa ultima columna: "label" es una convencion de este perfil.
csv_columns: [te, td, sa, da, sp, dp, pr, flg, fwd, stos, pkt, byt, label]

column_roles:
  label_col: "label"
  time_col: "te"
  src_ip_col: "sa"
  dst_ip_col: "da"
  src_port_col: "sp"
  dst_port_col: "dp"
  protocol_col: "pr"

# Etiquetas segun la tabla VII del paper. "background" es todo lo no probado
# como ataque.
label_values:
  benign: "background"
  attacks:
    dos: "DoS11, DoS53s, DoS53a (sinteticos)"
    scan11: "Scan11 (sintetico)"
    scan44: "Scan44 (sintetico)"
    nerisbotnet: "captura CTU-Malware-Capture-Botnet-42 reinyectada"
    blacklist: "IPs en 4 listas negras publicas (10.175 IPs); no todo es un ataque"
    anomaly-udpscan: "anomalia detectada, 2016-08-01 04:10 a 04:14"
    anomaly-sshscan: "anomalia detectada, 2016-04-10 a 2016-04-21 (IP 42.219.156.231)"
    anomaly-spam: "anomalia detectada, 2016-08-06 20:39 a 2016-08-07 05:59"

captures:
  calibration: { start: "2016-03-18 10:47", end: "2016-06-26 18:27", synthetic_attacks: false }
  test: { start: "2016-07-27 13:38", end: "2016-08-29 09:27", synthetic_attacks_from: "2016-07-28 00:00", synthetic_attacks_until: "2016-08-09 12:00" }
  calibration_gaps: ["2016-03-27 02:00 a 03:00", "2016-04-01 00:00 a 2016-04-06 17:20"]

# IPs anonimizadas (CryptoPAN) de la maquina experimental, tabla V.
known_attackers:
  - "42.219.150.246" # A1
  - "42.219.150.247" # A2
  - "42.219.150.243" # A3
  - "42.219.150.242" # A4
  - "42.219.150.241" # A5
  - "42.219.156.231" # origen del anomaly-sshscan
victim_ips:
  V11-V15: ["42.219.156.30", "42.219.156.31", "42.219.156.29", "42.219.156.28", "42.219.156.27"]
  V21-V25: ["42.219.158.16", "42.219.158.17", "42.219.158.18", "42.219.158.19", "42.219.158.21"]
  V31-V35: ["42.219.152.20", "42.219.152.21", "42.219.152.22", "42.219.152.23", "42.219.152.18"]
  V41-V45: ["42.219.154.69", "42.219.154.68", "42.219.154.70", "42.219.154.71", "42.219.154.66"]

