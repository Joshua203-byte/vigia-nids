# Problemas conocidos. Los de CICFlowMeter son los mismos que en CIC-IDS2017;
# los marcados "observado" se comprobaron en los CSV (30/09/2026).
known_issues:
  - id: "timestamp_12h"
    note: >
      Observado: la columna Timestamp usa reloj de 12 horas sin AM/PM
      (p. ej. Hulk aparece a las 01:45 y la documentacion dice 13:45).
      Ordenar por Timestamp mezcla manana y tarde, asi que leak.temporal no
      es fiable sobre esa columna.
  - id: "sin_ips_ni_split"
    note: >
      Observado: la version procesada no trae IPs ni columna de split, asi
      que leak.host, leak.session y leak.temporal no corren.
  - id: "truncado_excel"
    note: >
      Observado: 7 de los 10 CSV (14, 15, 16, 21, 22, 23-02 y 02-03) se
      cortan en 1.048.575 filas, el limite de Excel. 20-02, 28-02 y 01-03
      estan completos.
  - id: "etiquetas_vs_documentacion"
    note: >
      Observado: Bot (02-03) esta etiquetado durante todo el dia y no solo en
      las dos ventanas publicadas; SQL Injection (22 y 23-02) son 34 y 53
      filas dispersas fuera de su ventana; el CSV del 20-02 no trae etiqueta
      LOIC-UDP.
  - id: "flow.termination"
    note: >
      CICFlowMeter parte una conexion larga en varios flujos por timeout.
  - id: "validity.nan_inf"
    note: >
      Columnas de tasa generan NaN/Inf cuando la duracion del flujo es cero.
